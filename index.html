
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tanish – Digital Card</title>

<style>
:root{
  --card-blue:#0b2f6a;
  --text-light:#9ecbff;
  --white:#ffffff;
}

*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#eef2f8;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
}

/* ==== CARD WRAPPER ==== */
.scene{
  width:260px;
  height:260px;
  perspective:1000px;
}

/* ==== CARD ==== */
.card{
  width:100%;
  height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .7s cubic-bezier(.4,.2,.2,1);
  border-radius:22px;
  cursor:pointer;
}

/* ==== FLIP ==== */
.card.flipped{
  transform:rotateY(180deg);
}

/* ==== BOTH SIDES ==== */
.face{
  position:absolute;
  inset:0;
  border-radius:22px;
  background:linear-gradient(135deg,#0b3b88,#082b63);
  box-shadow:0 18px 40px rgba(0,0,0,.25);
  backface-visibility:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

/* ==== FRONT (2A LOOK) ==== */
.front img{
  width:120px;
  margin-bottom:14px;
}

.front span{
  color:var(--white);
  font-size:16px;
  letter-spacing:.6px;
}

/* ==== BACK (2B LOOK) ==== */
.back{
  transform:rotateY(180deg);
  padding:22px;
  align-items:flex-start;
  justify-content:space-between;
}

.info{
  color:var(--text-light);
}

.info h3{
  margin:0 0 8px;
  font-weight:500;
  font-size:18px;
}

.info p{
  margin:0;
  font-size:15px;
  opacity:.9;
}

.qr{
  align-self:flex-end;
}

.qr img{
  width:70px;
  opacity:.9;
}

.save{
  margin-top:14px;
  color:var(--text-light);
  font-size:13px;
  text-decoration:underline;
}
</style>
</head>

<body>

<div class="scene">
  <div class="card" id="card">

    <!-- FRONT -->
    <div class="face front">
      <img src="https://upload.wikimedia.org/wikipedia/commons/4/48/Dell_Logo.svg">
      <span>croma</span>
    </div>

    <!-- BACK -->
    <div class="face back">
      <div class="info">
        <h3>Tanish</h3>
        <p>+91 98765 43210</p>
        <div class="save" onclick="saveContact(event)">Save Contact</div>
      </div>

      <div class="qr">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://tetra54.github.io/Card/">
      </div>
    </div>

  </div>
</div>

<script>
const card=document.getElementById("card");

card.addEventListener("click",()=>{
  if(navigator.vibrate) navigator.vibrate(30);
  card.classList.toggle("flipped");
});

function saveContact(e){
  e.stopPropagation();
  if(navigator.vibrate) navigator.vibrate([20,40,20]);

  const vcf=`BEGIN:VCARD
VERSION:3.0
N:Tanish
FN:Tanish
TEL;TYPE=CELL:+919876543210
END:VCARD`;

  const blob=new Blob([vcf],{type:"text/vcard"});
  const link=document.createElement("a");
  link.href=URL.createObjectURL(blob);
  link.download="Tanish.vcf";
  link.click();
}
</script>

</body>
</html>
