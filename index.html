
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tanish – Digital Card</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #eef2f8;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

/* Scene gives depth */
.scene {
  width: 320px;
  height: 200px;
  perspective: 1000px;
}

/* Card rotates */
.card {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.8s ease;
  cursor: pointer;
}

.card.is-flipped {
  transform: rotateY(180deg);
}

/* Common face styles */
.card-face {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 18px;
  backface-visibility: hidden;
  background: linear-gradient(135deg, #0b2e6f, #0a1f44);
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  color: #e6f0ff;
}

/* FRONT */
.front {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.front .line {
  width: 120px;
  height: 1px;
  background: #9bbcff;
  margin: 8px 0;
}

.front .dell {
  font-size: 26px;
  font-weight: 600;
  letter-spacing: 1px;
}

.front .croma {
  font-size: 16px;
  opacity: 0.9;
}

/* BACK */
.back {
  transform: rotateY(180deg);
  padding: 22px;
  box-sizing: border-box;
}

.back .name {
  font-size: 18px;
  margin-bottom: 6px;
}

.back .phone {
  font-size: 15px;
  opacity: 0.9;
}

.back .qr {
  position: absolute;
  right: 18px;
  bottom: 18px;
  width: 64px;
  height: 64px;
  background: #ffffff;
}
</style>
</head>

<body>

<div class="scene">
  <div class="card" id="card">

    <!-- FRONT -->
    <div class="card-face front">
      <div class="dell">DELL Technologies</div>
      <div class="line"></div>
      <div class="croma">croma</div>
    </div>

    <!-- BACK -->
    <div class="card-face back">
      <div class="name">Tanish</div>
      <div class="phone">+91 98765 43210</div>
      <img class="qr"
        src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=https://tetra54.github.io/Card/"
        alt="QR">
    </div>

  </div>
</div>

<script>
const card = document.getElementById("card");

card.addEventListener("click", () => {
  card.classList.toggle("is-flipped");

  // download contact ONLY when flipped to back
  if (card.classList.contains("is-flipped")) {
    const vcard = `BEGIN:VCARD
VERSION:3.0
FN:Tanish
TEL:+919876543210
END:VCARD`;

    const blob = new Blob([vcard], { type: "text/vcard" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "Tanish.vcf";
    link.click();
  }
});
</script>

</body>
</html>
