<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Dell Card – Front</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#eef2f8;
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
}

/* CARD */
.card{
  width:260px;
  height:260px;
  background:linear-gradient(135deg,#0a2a66,#0d3b8c);
  border-radius:28px;
  box-shadow:0 30px 50px rgba(0,0,0,.28);
  display:flex;
  justify-content:center;
  align-items:center;
}

/* DELL LOGO */
.card img{
  width:140px;
  height:auto;
}
</style>
</head>

<body>

  <div class="card">
    <img src="assets/dell-circle-white.png" alt="Dell Logo">
  </div>

</body>
</html>
