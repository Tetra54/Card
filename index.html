
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tanish – Digital Card</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0a1f44;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

/* Scene */
.scene {
  width: 260px;
  height: 260px;
  perspective: 1000px;
}

/* Card */
.card {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.8s ease;
}

/* Flip state */
.card.is-flipped {
  transform: rotateY(180deg);
}

/* Faces */
.face {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 18px;
  background: linear-gradient(135deg, #0b3c91, #0a1f44);
  color: #dbe8ff;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}

/* Front */
.front h2 {
  margin: 0;
  font-size: 18px;
  letter-spacing: 0.5px;
}

.front p {
  margin-top: 6px;
  opacity: 0.8;
  font-size: 14px;
}

/* Back */
.back {
  transform: rotateY(180deg);
}

.back h3 {
  margin: 6px 0;
  font-size: 16px;
}

.back p {
  font-size: 14px;
  opacity: 0.9;
}

/* Buttons */
button {
  margin-top: 12px;
  padding: 6px 12px;
  font-size: 13px;
  border: 1px solid #dbe8ff;
  background: transparent;
  color: #dbe8ff;
  border-radius: 6px;
}

/* Hint */
.hint {
  position: absolute;
  bottom: -28px;
  font-size: 12px;
  opacity: 0.6;
}
</style>
</head>

<body>

<div class="scene">
  <div class="card" id="card">
    
    <!-- FRONT -->
    <div class="face front">
      <h2>DELL Technologies</h2>
      <p>croma</p>
      <div class="hint">Tap to flip</div>
    </div>

    <!-- BACK -->
    <div class="face back">
      <h3>Tanish</h3>
      <p>+91 98765 43210</p>
      <button onclick="saveContact(event)">Save Contact</button>
    </div>

  </div>
</div>

<script>
const card = document.getElementById("card");

/* Flip only */
card.addEventListener("click", () => {
  card.classList.toggle("is-flipped");
});

/* Save contact (separate action) */
function saveContact(e) {
  e.stopPropagation(); // VERY IMPORTANT

  const vcard = `BEGIN:VCARD
VERSION:3.0
FN:Tanish
ORG:Dell Technologies – Croma
TEL:+919876543210
END:VCARD`;

  const blob = new Blob([vcard], { type: "text/vcard" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "Tanish.vcf";
  link.click();
}
</script>

</body>
</html>
