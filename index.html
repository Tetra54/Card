<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Digital Card</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #eef2f6;
  font-family: system-ui, sans-serif;
}

.scene {
  width: 300px;
  height: 300px;
  perspective: 1000px;
}

.card {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.8s ease;
  cursor: pointer;
}

.card.flipped {
  transform: rotateY(180deg);
}

.side {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
}

.side img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.back {
  transform: rotateY(180deg);
}

/* WhatsApp Floating Button */
.whatsapp-btn {
  position: absolute;
  bottom: 15px;
  right: 15px;
  width: 45px;
  height: 45px;
  background: #25D366;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  z-index: 5;
}

.whatsapp-btn img {
  width: 24px;
  height: 24px;
}

/* Invisible phone click area */
.phone-click {
  position: absolute;
  bottom: 70px;   /* Adjust to match number position */
  left: 50%;
  transform: translateX(-50%);
  width: 180px;
  height: 40px;
}
</style>
</head>

<body>

<audio id="flipSound">
  <source src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3" type="audio/mpeg">
</audio>

<div class="scene">
  <div class="card" id="card">

    <div class="side front">
      <img src="front.jpg" alt="Front Card">
    </div>

    <div class="side back">
      <img src="back.jpg" alt="Back Card">

      <!-- Clickable Phone Area -->
      <a href="tel:+919876543210" class="phone-click"></a>

      <!-- WhatsApp Button -->
      <a href="https://wa.me/919876543210" class="whatsapp-btn" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
      </a>

    </div>

  </div>
</div>

<script>
const card = document.getElementById("card");
const flipSound = document.getElementById("flipSound");

card.addEventListener("click", function() {

  card.classList.toggle("flipped");

  // Haptic (Mobile)
  if (navigator.vibrate) {
    navigator.vibrate(20);
  }

  // Sound (Desktop)
  if (window.innerWidth > 768) {
    flipSound.play();
  }

});
</script>

</body>
</html>
