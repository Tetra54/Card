<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dell Card</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: #eef2f6;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .card {
    width: 300px;
    height: 300px;
    border-radius: 28px;
    background: linear-gradient(145deg, #0b3a7a, #062a5e);
    box-shadow: 0 25px 45px rgba(0,0,0,0.3);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .card img {
    width: 140px;
    height: auto;
  }
</style>
</head>

<body>

<div class="card">
  <img src="assets/dell-logo.svg" alt="Dell Logo">
</div>

</body>
</html>
