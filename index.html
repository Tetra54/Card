<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tanish – Digital Card</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #eef3fb, #dfe7f5);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .card {
      width: 260px;
      height: 260px;
      border-radius: 22px;
      background: linear-gradient(145deg, #0a2f6d, #0b3f92);
      box-shadow:
        0 20px 45px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand {
      text-align: center;
      color: #eaf2ff;
    }

    /* DELL Technologies – wordmark look */
    .dell {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .dell span {
      font-weight: 300;
      margin-left: 4px;
      opacity: 0.95;
    }

    .line {
      width: 90px;
      height: 1px;
      background: rgba(234, 242, 255, 0.45);
      margin: 10px auto 8px;
    }

    /* croma */
    .croma {
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 1px;
      opacity: 0.95;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="brand">
      <div class="dell">DELL<span>Technologies</span></div>
      <div class="line"></div>
      <div class="croma">croma</div>
    </div>
  </div>
</body>
</html>
