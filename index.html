<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dell Card Front</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #eef2f6;
    font-family: system-ui, -apple-system, BlinkMacSystemFont;
  }

  .card {
    width: 300px;
    height: 300px;
    border-radius: 28px;
    background: linear-gradient(145deg, #0b3a7a, #062a5e);
    box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo {
    width: 160px;
  }
</style>
</head>

<body>
  <div class="card">
    <img src="assets/dell-logo.svg" alt="Dell Logo" class="logo" />
  </div>
</body>
</html>
