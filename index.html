<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tanish – Digital Card</title>

<style>
:root{
  --card-blue:#0b2f6a;
  --card-blue-soft:#1e5fbf;
  --text-blue:#9fc7ff;
}

*{box-sizing:border-box;}

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#eef3fb;
  font-family:system-ui,-apple-system,BlinkMacSystemFont;
}

/* === CARD WRAPPER === */
.scene{
  perspective:1000px;
}

.card{
  width:260px;
  height:260px;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .7s cubic-bezier(.4,.2,.2,1);
}

.card.is-flipped{
  transform:rotateY(180deg);
}

/* === COMMON FACE === */
.face{
  position:absolute;
  inset:0;
  border-radius:22px;
  backface-visibility:hidden;
  background:linear-gradient(135deg,#0a2a5f,#0b3b85);
  box-shadow:0 20px 40px rgba(0,0,0,.25);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

/* === FRONT === */
.front img{
  width:140px;
  margin-bottom:10px;
}

.front .croma{
  font-size:18px;
  letter-spacing:.5px;
  color:#ffffff;
}

/* === BACK === */
.back{
  transform:rotateY(180deg);
  padding:22px;
}

.back .brand{
  width:160px;
  margin-bottom:18px;
}

.back .name{
  color:var(--text-blue);
  font-size:16px;
  margin-bottom:6px;
}

.back .phone{
  color:var(--text-blue);
  font-size:15px;
  margin-bottom:16px;
}

/* QR */
.qr{
  width:64px;            /* 👈 smaller */
  height:64px;
  opacity:.9;
  filter:hue-rotate(200deg) saturate(1.3); /* 👈 blue theme */
}

/* Tap hint (invisible but clickable) */
.tap{
  position:absolute;
  inset:0;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="scene">
  <div class="card" id="card">

    <!-- FRONT -->
    <div class="face front tap">
      <img src="https://upload.wikimedia.org/wikipedia/commons/1/18/Dell_Technologies_logo.svg" alt="Dell">
      <div class="croma">croma</div>
    </div>

    <!-- BACK -->
    <div class="face back tap">
      <img class="brand"
        src="https://upload.wikimedia.org/wikipedia/commons/1/18/Dell_Technologies_logo.svg"
        alt="Dell Technologies">

      <div class="name">Tanish</div>
      <div class="phone">+91 98765 43210</div>

      <img class="qr"
        src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=https://tetra54.github.io/Card/"
        alt="QR Code">
    </div>

  </div>
</div>

<script>
const card=document.getElementById("card");

document.querySelectorAll(".tap").forEach(el=>{
  el.addEventListener("click",()=>{
    card.classList.toggle("is-flipped");

    // Haptic
    if(navigator.vibrate) navigator.vibrate(20);
  });
});
</script>

</body>
</html>
