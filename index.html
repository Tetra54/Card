<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tanish – Digital Card</title>

<style>
:root{
  --blue-dark:#0b2a5b;
  --blue-mid:#0f3b8c;
  --blue-light:#7fb2ff;
  --white:#eaf1ff;
}

*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#eef3fb;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

/* ===== CARD WRAPPER ===== */
.scene{
  perspective:1200px;
}

.card{
  width:260px;
  height:260px;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .8s cubic-bezier(.4,.2,.2,1);
  border-radius:18px;
  cursor:pointer;
}

/* ===== COMMON FACE ===== */
.face{
  position:absolute;
  inset:0;
  border-radius:18px;
  backface-visibility:hidden;
  box-shadow:
    0 25px 45px rgba(0,0,0,.25),
    inset 0 0 0 1px rgba(255,255,255,.04);
  overflow:hidden;
}

/* ===== FABRIC / NOISE TEXTURE ===== */
.face::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(
      -45deg,
      rgba(255,255,255,.03),
      rgba(255,255,255,.03) 2px,
      rgba(0,0,0,.02) 4px
    );
  pointer-events:none;
}

/* ===== FRONT (2A LOOK) ===== */
.front{
  background:linear-gradient(135deg,var(--blue-mid),var(--blue-dark));
  color:var(--white);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.dell{
  font-weight:600;
  letter-spacing:.6px;
  font-size:20px;
}

.tech{
  font-weight:300;
  opacity:.9;
}

.line{
  width:120px;
  height:1px;
  background:rgba(255,255,255,.35);
  margin:10px 0 8px;
}

.croma{
  font-size:18px;
  letter-spacing:.3px;
  opacity:.9;
}

/* ===== BACK ===== */
.back{
  background:linear-gradient(135deg,#0e3b8a,#0a2554);
  transform:rotateY(180deg);
  color:var(--blue-light);
  padding:26px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.name{
  font-size:18px;
  color:var(--white);
}

.phone{
  font-size:16px;
  opacity:.9;
}

.qr{
  width:72px;
  height:72px;
  align-self:flex-end;
}

/* ===== FLIP ===== */
.card.flipped{
  transform:rotateY(180deg);
}
</style>
</head>

<body>

<div class="scene">
  <div class="card" onclick="flipCard()">

    <!-- FRONT -->
    <div class="face front">
      <div class="dell">DELL <span class="tech">Technologies</span></div>
      <div class="line"></div>
      <div class="croma">croma</div>
    </div>

    <!-- BACK -->
    <div class="face back">
      <div>
        <div class="dell">DELL <span class="tech">Technologies</span></div>
        <div class="name">Tanish</div>
        <div class="phone">+91 98765 43210</div>
      </div>

      <img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://wa.me/919876543210" />
    </div>

  </div>
</div>

<script>
function flipCard(){
  if(navigator.vibrate) navigator.vibrate(12);
  document.querySelector('.card').classList.toggle('flipped');
}
</script>

</body>
</html>
