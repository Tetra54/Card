<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tanish – Digital Card</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#eef2f8;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
}

.scene{
  width:260px;
  height:260px;
  perspective:1000px;
}

.card{
  width:100%;
  height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform 0.7s ease;
  border-radius:28px;
  box-shadow:0 28px 48px rgba(0,0,0,.28);
}

.card.flipped{
  transform:rotateY(180deg);
}

.face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  border-radius:28px;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* ---------- FRONT ---------- */
.front{
  background:linear-gradient(135deg,#0a2a66,#0d3b8c);
  flex-direction:column;
}

/* REAL DELL WORDMARK */
.dell-logo{
  width:180px;
  margin-bottom:22px;
}

/* CROMA – MINIMAL */
.croma{
  color:#ffffff;
  font-size:18px;
  letter-spacing:1px;
  opacity:.95;
}

/* ---------- BACK ---------- */
.back{
  background:linear-gradient(135deg,#0a2a66,#0d3b8c);
  transform:rotateY(180deg);
  color:#cfe3ff;
  padding:22px;
}

.info{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
}

.text{
  line-height:1.6;
}

.name{
  font-size:18px;
}

.phone{
  font-size:16px;
  margin-top:6px;
}

.qr{
  width:58px;
  height:58px;
  opacity:.9;
}
</style>
</head>

<body>

<div class="scene">
  <div class="card" id="card">

    <!-- FRONT -->
    <div class="face front">
      <!-- USE REAL DELL LOGO IMAGE (WORDMARK ONLY) -->
      <img src="assets/dell-technologies.png" class="dell-logo" alt="Dell Technologies">
      <div class="croma">croma</div>
    </div>

    <!-- BACK -->
    <div class="face back">
      <div class="info">
        <div class="text">
          <div class="name">Tanish</div>
          <div class="phone">+91 98765 43210</div>
        </div>

        <img
          class="qr"
          src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&color=120-180-255&bgcolor=10-42-102&data=https://tetra54.github.io/Card/"
          alt="QR"
        />
      </div>
    </div>

  </div>
</div>

<script>
let flipped=false;

document.getElementById("card").addEventListener("click",()=>{
  navigator.vibrate?.(20);

  if(!flipped){
    document.getElementById("card").classList.add("flipped");
    flipped=true;
  }else{
    const vcard=`BEGIN:VCARD
VERSION:3.0
FN:Tanish
TEL:+919876543210
END:VCARD`;

    const blob=new Blob([vcard],{type:"text/vcard"});
    const link=document.createElement("a");
    link.href=URL.createObjectURL(blob);
    link.download="Tanish.vcf";
    link.click();
  }
});
</script>

</body>
</html>
