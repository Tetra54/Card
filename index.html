<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Dell Card – Front</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#eef2f8;
}

/* CARD */
.card{
  width:260px;
  height:260px;
  background:linear-gradient(135deg,#0a2a66,#0d3b8c);
  border-radius:28px;
  box-shadow:0 30px 50px rgba(0,0,0,.28);
  display:flex;
  justify-content:center;
  align-items:center;
}

/* LOGO SIZE */
.logo{
  width:140px;
}
</style>
</head>

<body>

<div class="card">

<!-- INLINE SVG : DELL LOGO -->
<svg class="logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <circle cx="256" cy="256" r="220" fill="none" stroke="#22b8f0" stroke-width="28"/>
  <text x="50%" y="55%"
        text-anchor="middle"
        font-size="160"
        font-weight="700"
        fill="#22b8f0"
        font-family="Arial, Helvetica, sans-serif">
    DELL
  </text>
</svg>

</div>

</body>
</html>
