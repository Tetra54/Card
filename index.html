<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tanish – Digital Card</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#e9eef7;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

/* CARD CONTAINER */
.scene{
  width:260px;
  height:260px;
  perspective:900px;
}

/* FLIP CARD */
.card{
  width:100%;
  height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform 0.8s ease;
  cursor:pointer;
}
.card.flipped{
  transform:rotateY(180deg);
}

/* COMMON FACE */
.face{
  position:absolute;
  width:100%;
  height:100%;
  backface-visibility:hidden;
  border-radius:16px;
  background:linear-gradient(135deg,#0b3c91,#0a1f44);
  color:#ffffff;
  box-shadow:0 20px 40px rgba(0,0,0,0.25);
}

/* FRONT */
.front{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}
.front img{
  width:140px;
  margin-bottom:10px;
}
.front .brand{
  font-size:20px;
  opacity:0.9;
}

/* BACK */
.back{
  transform:rotateY(180deg);
  padding:20px;
  box-sizing:border-box;
}
.back .info{
  position:absolute;
  right:20px;
  top:80px;
  text-align:right;
}
.back .name{
  font-size:18px;
  margin-bottom:6px;
}
.back .phone{
  font-size:15px;
  opacity:0.9;
}
.back img{
  position:absolute;
  right:20px;
  bottom:20px;
  width:70px;
}

/* SAVE BUTTON */
.save{
  position:absolute;
  left:20px;
  bottom:20px;
  font-size:12px;
  opacity:0.8;
  text-decoration:underline;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="scene">
  <div class="card" id="card">

    <!-- FRONT -->
    <div class="face front">
      <img src="https://upload.wikimedia.org/wikipedia/commons/4/48/Dell_Logo.svg">
      <div class="brand">croma</div>
    </div>

    <!-- BACK -->
    <div class="face back">
      <div class="info">
        <div class="name">Tanish</div>
        <div class="phone">+91 98765 43210</div>
      </div>

      <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://tetra54.github.io/Card/">

      <div class="save" onclick="saveContact(event)">Save Contact</div>
    </div>

  </div>
</div>

<script>
const card = document.getElementById("card");

card.addEventListener("click", () => {
  card.classList.toggle("flipped");
});

function saveContact(e){
  e.stopPropagation();

  const vcard = `BEGIN:VCARD
VERSION:3.0
FN:Tanish
ORG:Dell Technologies – Croma
TEL:+919876543210
END:VCARD`;

  const blob = new Blob([vcard], {type:"text/vcard"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "Tanish.vcf";
  link.click();
}
</script>

</body>
</html>
